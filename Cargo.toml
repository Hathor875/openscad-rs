[package]
name = "openscad-rust"
version = "0.1.0"
edition = "2021"
description = "OpenSCAD rewritten in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/Hathor875/openscad-rs"
homepage = "https://github.com/Hathor875/openscad-rs"
authors = ["Krzysztof Cieślik"]

[package.metadata.wix]
upgrade-guid = "C3BCA37D-F5CF-4519-AECE-EC4CD229FF4A"
path-guid = "F8250F6C-4488-46BF-BE94-7A6A638017DC"
license = false
eula = false

[dependencies]
# Parsing
pest = { version = "2.7" }
pest_derive = "2.7"
logos = "0.12"
# AST/location
rowan = "0.17"
text-size = "1.1"
# Error handling
thiserror = "1.0"
# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Math
num-traits = "0.2"
nalgebra = "0.35.0"
# CSG with exact boolean operations
manifold3d = "0.4.1"
# GUI
eframe = "0.24"
egui = "0.36"
egui-wgpu = "0.36"
winit = "0.30"
rfd = "0.14"

# eframe 0.24.1 declares winapi on Windows without the features its own
# sources need, so Windows builds fail with "no `winuser` in `um`". Enabling
# them here unifies the features for the whole graph. Can be dropped once
# eframe is upgraded.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "commctrl",
    "errhandlingapi",
    "libloaderapi",
    "shellapi",
    "windef",
    "winreg",
    "winuser",
] }

[dev-dependencies]
pretty_assertions = "1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
