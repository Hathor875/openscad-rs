[package]
name = "openscad-rust"
version = "0.1.0"
edition = "2021"
description = "OpenSCAD rewritten in Rust"

[dependencies]
# Parsing
pest = { version = "2.7" }
pest_derive = "2.7"
logos = "0.12"
# AST/location
rowan = "0.17"
text-size = "1.1"
# Error handling
thiserror = "1.0"
# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Math
num-traits = "0.2"
nalgebra = "0.35.0"

[dev-dependencies]
pretty_assertions = "1.4"
